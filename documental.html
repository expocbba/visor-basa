<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Equilibrio entre el centro y lo local · Museo BASA</title>
    <style>
      :root { color-scheme: dark; --oro: #c7a96b; --linea: rgba(244, 240, 232, 0.16); }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #100f0d;
        color: #f4f0e8;
        font-family: "Helvetica Neue", Helvetica, Arial, system-ui, -apple-system, sans-serif;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        overflow: hidden;
      }
      header { padding: 16px 24px 12px; border-bottom: 1px solid var(--linea); }
      .clase { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--oro); }
      h1 { margin: 0; font-size: 16px; font-weight: 500; line-height: 1.4; max-width: 74ch; }
      .lienzo { position: relative; min-height: 0; background: #000; }
      video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
      #arranque {
        position: absolute; inset: 0; display: grid; place-items: center;
        border: 0; border-radius: 0; padding: 0; background: transparent; cursor: pointer;
        pointer-events: none;
      }
      #arranque span {
        pointer-events: auto; cursor: pointer;
        width: 72px; height: 72px; border-radius: 50%; border: 1px solid var(--oro);
        background: rgba(16, 15, 13, 0.55); display: grid; place-items: center;
        backdrop-filter: blur(2px);
      }
      #arranque span::after {
        content: ""; margin-left: 5px;
        border-left: 20px solid var(--oro);
        border-top: 13px solid transparent;
        border-bottom: 13px solid transparent;
      }
      #arranque:hover span { background: rgba(199, 169, 107, 0.22); }
      footer { padding: 10px 24px 12px; display: flex; justify-content: space-between; align-items: center; gap: 16px; border-top: 1px solid var(--linea); }
      .pie { margin: 0; font-size: 12px; color: rgba(244, 240, 232, 0.6); }
      button {
        appearance: none; cursor: pointer; font: inherit; font-size: 12px;
        letter-spacing: 0.14em; text-transform: uppercase; color: var(--oro);
        background: transparent; border: 1px solid var(--oro); border-radius: 999px; padding: 9px 20px;
      }
      #completa:hover { background: rgba(199, 169, 107, 0.14); }
      @media (max-width: 640px) {
        h1 { font-size: 14px; }
        header { padding: 12px 16px 10px; }
        footer { padding: 8px 16px 12px; }
        .pie { font-size: 11px; }
        #arranque span { width: 56px; height: 56px; }
      }
    </style>
  </head>
  <body>
    <header>
      <p class="clase">Documental</p>
      <h1>Equilibrio entre el centro y lo local. Estrategias de movilización y producción del estado Inka colonial temprano en Cochabamba, Bolivia.</h1>
    </header>
    <div class="lienzo">
      <video id="pelicula" controls playsinline preload="metadata" poster="./portada.jpg"></video>
      <button id="arranque" type="button" aria-label="Reproducir"><span></span></button>
    </div>
    <footer>
      <p class="pie">Museo BASA, Colección de las Américas de Bonn</p>
      <button id="completa" type="button">Pantalla completa</button>
    </footer>
    <script>
      (function () {
        var v = document.getElementById("pelicula");
        var b = document.getElementById("arranque");
        var lista = "./doc.m3u8";
        function nativo() {
          if (v.canPlayType("application/vnd.apple.mpegurl")) { v.setAttribute("src", lista); return; }
          v.setAttribute("src", "./documental-muro.mp4");
        }
        var g = document.createElement("script");
        g.src = "./hls.min.js";
        g.addEventListener("load", function () {
          if (!window.Hls || !window.Hls.isSupported()) { nativo(); return; }
          var m = new window.Hls({ maxBufferLength: 45 });
          m.loadSource(lista);
          m.attachMedia(v);
        });
        g.addEventListener("error", nativo);
        document.head.appendChild(g);
        b.addEventListener("click", function () { v.play(); });
        v.addEventListener("play", function () { b.style.display = "none"; });
        document.getElementById("completa").addEventListener("click", function () {
          var d = document.documentElement;
          if (document.fullscreenElement) { document.exitFullscreen(); return; }
          if (v.webkitEnterFullscreen) { v.webkitEnterFullscreen(); return; }
          (d.requestFullscreen || d.webkitRequestFullscreen).call(d);
        });
      })();
    </script>
  </body>
</html>
